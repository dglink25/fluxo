# Lance uniquement une base PostgreSQL locale pour le développement.
# Usage : docker compose up -d
version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: fluxo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fluxo
      POSTGRES_PASSWORD: fluxo
      POSTGRES_DB: fluxo
    ports:
      - '5432:5432'
    volumes:
      - fluxo_pg_data:/var/lib/postgresql/data

volumes:
  fluxo_pg_data:
