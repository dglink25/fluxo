<div class="auth-screen">
  <div class="auth-card flx-card">
    <div class="mark">Fx</div>
    <h1>Créer votre espace Fluxo</h1>
    <p class="sub">Quelques informations pour commencer.</p>

    <form (ngSubmit)="submit()" class="form">
      <label>
        Nom complet
        <input class="flx-input" name="fullName" [(ngModel)]="fullName" autocomplete="name" />
      </label>
      <label>
        Pseudo
        <input class="flx-input" name="username" [(ngModel)]="username" required autocomplete="username" />
      </label>
      <label>
        Email
        <input class="flx-input" type="email" name="email" [(ngModel)]="email" required autocomplete="email" />
      </label>
      <label>
        Mot de passe
        <input class="flx-input" type="password" name="password" [(ngModel)]="password" required minlength="8" autocomplete="new-password" />
      </label>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button class="flx-btn flx-btn--primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Création…' : 'Créer mon compte' }}
      </button>
    </form>

    <p class="footer">Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
  </div>
</div>
