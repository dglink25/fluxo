<div class="auth-screen">
  <div class="auth-card flx-card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Dégradé vert principal -->
          <linearGradient id="fxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0B6B2E"/>
            <stop offset="35%" stop-color="#1FA34A"/>
            <stop offset="70%" stop-color="#3FCB5C"/>
            <stop offset="100%" stop-color="#0A5C28"/>
          </linearGradient>
          <!-- Dégradé vert clair (reflet lumineux) -->
          <linearGradient id="fxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4FD66E"/>
            <stop offset="50%" stop-color="#A8F0A8"/>
            <stop offset="100%" stop-color="#1FA34A"/>
          </linearGradient>
          <!-- Dégradé pour l'ombre -->
          <radialGradient id="fxShadow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(0,0,0,0.35)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
          </radialGradient>
        </defs>

        <!-- Ombre au sol -->
        <ellipse cx="60" cy="74" rx="32" ry="3.5" fill="url(#fxShadow)"/>

        <!-- Boucle gauche -->
        <path d="M60 40
                 C 60 20, 40 8, 24 8
                 C 8 8, 4 22, 4 34
                 C 4 48, 12 58, 26 58
                 C 40 58, 50 48, 60 40 Z"
              fill="url(#fxGrad1)"/>

        <!-- Boucle droite -->
        <path d="M60 40
                 C 60 20, 80 8, 96 8
                 C 112 8, 116 22, 116 34
                 C 116 48, 108 58, 94 58
                 C 80 58, 70 48, 60 40 Z"
              fill="url(#fxGrad1)"/>

        <!-- Ruban clair gauche (reflet) -->
        <path d="M60 40
                 C 52 30, 42 22, 28 22
                 C 18 22, 12 28, 12 36
                 C 12 44, 20 50, 30 50
                 C 42 50, 52 46, 60 40 Z"
              fill="url(#fxGrad2)" opacity="0.9"/>

        <!-- Ruban clair droit (reflet) -->
        <path d="M60 40
                 C 68 30, 78 22, 92 22
                 C 102 22, 108 28, 108 36
                 C 108 44, 100 50, 90 50
                 C 78 50, 68 46, 60 40 Z"
              fill="url(#fxGrad2)" opacity="0.9"/>

        <!-- Courbe blanche en S (signature) -->
        <path d="M42 34
                 C 52 30, 56 42, 62 44
                 C 68 46, 74 42, 78 34"
              stroke="#ffffff" stroke-width="4" fill="none"
              stroke-linecap="round"/>

        <!-- Ombre interne pour profondeur -->
        <path d="M60 40
                 C 60 20, 40 8, 24 8
                 C 8 8, 4 22, 4 34
                 C 4 48, 12 58, 26 58
                 C 40 58, 50 48, 60 40 Z"
              fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
      </svg>
    </div>

    <h1>Bienvenue sur Fluxo</h1>
    <p class="sub">Connectez-vous avec votre compte Google ou GitHub pour continuer.</p>

    <div class="providers">
      <button class="flx-btn provider-btn google-btn" type="button" (click)="loginWith('google')">
        <svg class="provider-icon" viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continuer avec Google
      </button>

      <button class="flx-btn provider-btn github-btn" type="button" (click)="loginWith('github')">
        <svg class="provider-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.21.08 1.84 1.24 1.84 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.66-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.17 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6.01 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.65.24 2.87.12 3.17.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.49 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.82.58A12 12 0 0 0 24 12.5C24 5.87 18.63.5 12 .5z"/>
        </svg>
        Continuer avec GitHub
      </button>
    </div>

    <p class="note">
      <flx-icon name="phone" [size]="14"></flx-icon>
      Une vérification de votre numéro par WhatsApp vous sera demandée à la première connexion.
    </p>
  </div>
</div>
